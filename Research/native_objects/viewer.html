<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORYN · Native object experiment</title>
<style>body{margin:0;background:#101921;color:#e5eff4;font:16px system-ui}header,main{max-width:1200px;margin:auto;padding:24px}h1{font-size:30px;margin:12px 0}p{max-width:900px;line-height:1.5;color:#b5c5cf}select,button,input{font:inherit}select,button{background:#21343f;color:#e5eff4;border:1px solid #567181;padding:9px;border-radius:6px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}canvas{display:block;width:100%;height:510px;background:#15232e;border-radius:12px;touch-action:none}nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:18px 0}#facts{color:#8ce2c1}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:10px;border-bottom:1px solid #31434f}.fail{color:#ffae9f}.pass{color:#8ce2c1}small{color:#94b0c0}label{display:flex;gap:8px;align-items:center}</style>
<header><small>ORYN / GENERATION RESEARCH</small><h1>What did the system actually produce?</h1><p>These controls establish what we can measure. They are not new AI generations or a visual-quality milestone. Geometry remains the same during inspection and separation. Drag to orbit.</p><select id="case" aria-label="Experiment case"></select></header>
<main><div id="facts"></div><nav><label>Separate <input id="spread" type="range" min="0" max="1" step=".01" value="0"></label><button id="motion">Play recorded motion</button><button id="reset">Reassemble / reset</button><label>Inspect <select id="part"><option value="">All parts</option></select></label></nav><canvas id="view" width="1200" height="510"></canvas><p id="scope"></p><ul id="layers" aria-label="Separate evaluation layers"></ul><table><thead><tr><th>Check</th><th>Status</th><th>Evidence / limitation</th></tr></thead><tbody id="checks"></tbody></table></main>
<script>
let pkg=null,playing=false,phase=0,yaw=.65,pitch=.45,zoom=1,drag=null;const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d');
function cell(row,text){const td=document.createElement('td');td.textContent=text;row.append(td);return td;}
async function choose(name){playing=false;phase=0;$('spread').value=0;pkg=await(await fetch(name+'/package.json')).json();const report=await(await fetch(name+'/report.json')).json();$('facts').textContent=report.components+' geometry parts · '+report.triangles+' triangles · geometry: '+report.origins.geometry+' · motion: '+report.origins.motion;$('scope').textContent=report.verdict+' Geometry uses analysis shading. Materials, mechanical fit and Quest performance are not validated here.';$('layers').replaceChildren();for(const [name,layer] of Object.entries(report.layers||{})){const li=document.createElement('li');const state=name==='object'?(layer.structural_checks_passed?'structure passes; quality unassessed':'structure fails'):layer.status;li.textContent=name.replaceAll('_',' ')+': '+state.replaceAll('_',' ')+(layer.missing_output_facets?.length?' · missing '+layer.missing_output_facets.join(', '):'')+'. '+layer.detail;$('layers').append(li);} $('checks').replaceChildren();for(const [k,v] of Object.entries(report.checks)){const tr=document.createElement('tr');cell(tr,k.replaceAll('_',' '));cell(tr,v.status).className=v.status;cell(tr,v.detail);$('checks').append(tr);}$('motion').disabled=!pkg.frames.length;$('motion').textContent='Play recorded motion';$('part').replaceChildren(new Option('All parts',''));for(const p of pkg.parts)$('part').add(new Option(p.semantic_role?p.id+' · '+p.semantic_role:p.id+' · unidentified',p.id));draw();}
function draw(){if(!pkg)return;ctx.clearRect(0,0,1200,510);const all=pkg.parts.flatMap(p=>p.vertices);let lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];for(const v of all)for(let i=0;i<3;i++){lo[i]=Math.min(lo[i],v[i]);hi[i]=Math.max(hi[i],v[i]);}const center=lo.map((x,i)=>(x+hi[i])/2),scale=300/Math.max(...hi.map((x,i)=>x-lo[i]),.01)*zoom;
 const frame=pkg.frames.length?pkg.frames[Math.min(pkg.frames.length-1,Math.floor(phase*(pkg.frames.length-1)))]:null,faces=[];
 for(const p of pkg.parts){if($('part').value&&$('part').value!==p.id)continue;const verts=frame?frame.parts[p.id]:p.vertices,c=[0,0,0];for(const v of p.vertices)for(let i=0;i<3;i++)c[i]+=v[i]/p.vertices.length;const offset=c.map((x,i)=>(x-center[i])*Number($('spread').value));const projected=verts.map(v=>{let [x,y,z]=v.map((x,i)=>x-center[i]+offset[i]);let a=x*Math.cos(yaw)+z*Math.sin(yaw),b=-x*Math.sin(yaw)+z*Math.cos(yaw);return [600+a*scale,260-(y*Math.cos(pitch)-b*Math.sin(pitch))*scale,(y*Math.sin(pitch)+b*Math.cos(pitch))*scale];});for(let i=0;i<p.triangles.length;i+=3){const pts=p.triangles.slice(i,i+3).map(k=>projected[k]);faces.push({pts,color:p.color||[.5,.6,.7],depth:pts.reduce((n,p)=>n+p[2],0)/3});}}
 faces.sort((a,b)=>a.depth-b.depth);for(const f of faces){const [a,b,c]=f.pts,u=b.map((x,i)=>x-a[i]),v=c.map((x,i)=>x-a[i]);const n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],norm=Math.hypot(...n)||1;const light=.25+.65*Math.abs((n[0]*.3-n[1]*.4+n[2]*.866)/norm);ctx.fillStyle='rgb('+f.color.map(x=>Math.round(Math.min(1,x*light+.08)*255)).join(',')+')';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.closePath();ctx.fill();}ctx.fillStyle='#c5d8e2';ctx.font='14px system-ui';ctx.fillText(pkg.source.kind.replaceAll('_',' ')+' · '+(playing?'recorded runtime motion':'inspection'),20,30);window.orynView={case:pkg.id,spread:Number($('spread').value),phase,playing,parts:pkg.parts.length};}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.4,Math.min(1.4,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw();};canvas.onpointerup=()=>drag=null;$('spread').oninput=draw;$('part').onchange=draw;$('motion').onclick=()=>{playing=!playing;$('motion').textContent=playing?'Pause':'Play recorded motion';};$('reset').onclick=()=>{playing=false;phase=0;$('spread').value=0;$('part').value='';$('motion').textContent='Play recorded motion';draw();};$('case').onchange=()=>choose($('case').value);let last=0;function tick(t){if(playing){phase=(phase+(t-last)/4000)%1;draw();}last=t;requestAnimationFrame(tick);}requestAnimationFrame(tick);fetch('index.json').then(r=>r.json()).then(async entries=>{for(const e of entries)$('case').add(new Option(e.name,e.name));await choose(entries[0].name);}).catch(e=>{$('facts').textContent='Could not load experiment: '+e.message;});
</script></html>
